<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Quality Dashboard</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#5d6675;--border:#e2e5ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1217;--card:#181c23;--text:#eef1f5;--muted:#9aa3b2;--border:#2a303a}}
:root[data-theme="dark"]{--bg:#0f1217;--card:#181c23;--text:#eef1f5;--muted:#9aa3b2;--border:#2a303a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
select{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big{font-size:3.6rem;font-weight:700;line-height:1}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-weight:600;font-size:.85rem}
.advice{margin:12px 0 0;font-size:1rem}
.bar{height:10px;border-radius:99px;background:linear-gradient(90deg,#2e9e5b 0 17%,#e0b400 17% 33%,#e8782a 33% 50%,#d63c3c 50% 67%,#8b3fa8 67% 100%);position:relative;margin-top:14px}
.dot{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--text);transform:translateX(-50%)}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;margin-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.75rem;color:var(--muted)}
.col b{color:var(--text);font-size:.8rem}
.col div{width:100%;border-radius:6px 6px 0 0;min-height:4px}
.note{font-size:.8rem;color:var(--muted)}
h2{font-size:1rem;margin:0}
</style>
</head>
<body>
<main>
<h1>Air Quality Dashboard</h1>
<p class="sub">Live AQI, plain-language advice and a 7-day trend.</p>
<select id="city" aria-label="City"></select>

<div class="card">
<div class="hero">
<div><div class="big" id="aqi">--</div><div class="note">US AQI</div></div>
<div><span class="badge" id="cat">Loading</span><div class="note" id="pm" style="margin-top:6px"></div></div>
</div>
<p class="advice" id="advice"></p>
<div class="bar"><div class="dot" id="dot" style="left:0"></div></div>
</div>

<div class="card">
<h2>Past 7 days (daily average)</h2>
<div class="chart" id="chart"></div>
</div>

<p class="note" id="src"></p>
</main>

<script>
const CITIES={
 "Delhi":[28.61,77.21],"Mumbai":[19.08,72.88],"Bengaluru":[12.97,77.59],
 "Kolkata":[22.57,88.36],"Chennai":[13.08,80.27]
};
const LEVELS=[
 {max:50,name:"Good",color:"#2e9e5b",tip:"Air is clean. Enjoy outdoor activities."},
 {max:100,name:"Moderate",color:"#c9a000",tip:"Acceptable. Very sensitive people should limit long outdoor effort."},
 {max:150,name:"Unhealthy for Sensitive Groups",color:"#e8782a",tip:"Children, elderly and asthma patients should reduce outdoor exercise."},
 {max:200,name:"Unhealthy",color:"#d63c3c",tip:"Wear an N95 mask outside and cut down on outdoor exercise."},
 {max:300,name:"Very Unhealthy",color:"#8b3fa8",tip:"Avoid outdoor activity. Keep windows closed and use an air purifier."},
 {max:9999,name:"Hazardous",color:"#7e0023",tip:"Stay indoors. Wear an N95 mask if you must go out."}
];
const level=v=>LEVELS.find(l=>v<=l.max);

// Sample data used when the live API can't be reached
function sample(city){
 const base={Delhi:210,Mumbai:120,Bengaluru:70,Kolkata:160,Chennai:85}[city];
 const days=[];
 for(let i=6;i>=0;i--){
  const d=new Date();d.setDate(d.getDate()-i);
  days.push({label:d.toLocaleDateString("en",{weekday:"short"}),aqi:Math.round(base+Math.sin(i*1.7)*base*.22)});
 }
 return {now:days[6].aqi,pm25:Math.round(days[6].aqi*.45),days,live:false};
}

// Live data: Open-Meteo Air Quality API (free, no key). Works when hosted on your own site.
async function getAQI(city){
 try{
  const [lat,lon]=CITIES[city];
  const url="https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+lat+"&longitude="+lon+
   "&current=us_aqi,pm2_5&hourly=us_aqi&past_days=6&forecast_days=1&timezone=auto";
  const r=await fetch(url);
  if(!r.ok)throw new Error("bad response");
  const j=await r.json();
  const byDay={};
  j.hourly.time.forEach((t,i)=>{const v=j.hourly.us_aqi[i];if(v==null)return;(byDay[t.slice(0,10)]=byDay[t.slice(0,10)]||[]).push(v)});
  const days=Object.keys(byDay).slice(-7).map(k=>({
   label:new Date(k+"T12:00").toLocaleDateString("en",{weekday:"short"}),
   aqi:Math.round(byDay[k].reduce((a,b)=>a+b,0)/byDay[k].length)}));
  return {now:Math.round(j.current.us_aqi),pm25:Math.round(j.current.pm2_5),days,live:true};
 }catch(e){return sample(city)}
}

async function render(city){
 const d=await getAQI(city);
 const L=level(d.now);
 document.getElementById("aqi").textContent=d.now;
 document.getElementById("aqi").style.color=L.color;
 const c=document.getElementById("cat");c.textContent=L.name;c.style.background=L.color;
 document.getElementById("pm").textContent="PM2.5: "+d.pm25+" µg/m³";
 document.getElementById("advice").textContent=L.tip;
 document.getElementById("dot").style.left=Math.min(d.now/300*100,100)+"%";
 const max=Math.max(...d.days.map(x=>x.aqi),100);
 document.getElementById("chart").innerHTML=d.days.map(x=>
  '<div class="col"><b>'+x.aqi+'</b><div style="height:'+(x.aqi/max*120)+'px;background:'+level(x.aqi).color+'"></div>'+x.label+'</div>').join("");
 document.getElementById("src").textContent=d.live
  ?"Live data from Open-Meteo. Last updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+"."
  :"Showing sample data for demo. Host this file on your own site (e.g. GitHub Pages) to load live data.";
}

const sel=document.getElementById("city");
sel.innerHTML=Object.keys(CITIES).map(c=>'<option>'+c+'</option>').join("");
sel.onchange=()=>render(sel.value);
render("Delhi");
setInterval(()=>render(sel.value),30*60*1000);
</script>
</body>
</html>
